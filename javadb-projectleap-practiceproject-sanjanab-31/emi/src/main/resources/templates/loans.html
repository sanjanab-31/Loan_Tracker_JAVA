<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section}, 'Manage Loans', 'loans')}">

<head>
</head>

<body>
    <section>
        <div class="card-table-wrapper">
            <div class="card-table-header">
                <h2 class="table-title">Loan Portfolios</h2>
                <a th:if="${not #lists.isEmpty(loans)}" th:href="@{/loans/new(userId=${loans[0].user.userId})}"
                    class="btn-primary">
                    <i data-lucide="plus-circle" style="width: 18px; height: 18px;"></i>
                    <span>New Loan</span>
                </a>
            </div>
            <div style="overflow-x: auto;">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Principal</th>
                            <th>ROI</th>
                            <th>Tenure</th>
                            <th>Monthly EMI</th>
                            <th>Total Payable</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="loan : ${loans}">
                            <td th:text="${'L' + loan.loanId}">L1</td>
                            <td class="fw-600" th:text="${'₹' + loan.principal}">₹10,000</td>
                            <td th:text="${loan.interestRate + '%'}">12%</td>
                            <td th:text="${loan.tenureMonths + ' Mo'}">12 Mo</td>
                            <td class="fw-600" style="color: var(--primary);" th:text="${'₹' + loan.emiAmount}">₹933.33
                            </td>
                            <td th:text="${'₹' + loan.totalPayable}">₹11,200</td>
                            <td style="text-align: right;">
                                <a th:href="@{'/loan/' + ${loan.loanId} + '/emipayment'}" class="btn-outline">
                                    <i data-lucide="calendar"
                                        style="width: 16px; height: 16px; vertical-align: middle;"></i>
                                    <span>EMI Schedule</span>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(loans)}">
                            <td colspan="7" style="text-align: center; padding: 4rem; color: var(--secondary);">
                                <i data-lucide="file-warning"
                                    style="width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.5;"></i>
                                <p>No loan records found for this user.</p>
                                <div style="margin-top: 1.5rem;" th:if="${param.userId}">
                                    <a th:href="@{/loans/new(userId=${param.userId})}" class="btn-primary">Disburse
                                        First Loan</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div style="margin-top: 2rem;">
            <a th:href="@{/}" class="btn-outline">
                <i data-lucide="arrow-left" style="width: 16px; height: 16px; vertical-align: middle;"></i>
                <span>Back to All Users</span>
            </a>
        </div>
    </section>
</body>

</html>
