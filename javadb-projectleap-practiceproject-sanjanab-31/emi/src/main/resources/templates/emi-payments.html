<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section}, 'Repayment Schedule', 'loans')}">

<head>
</head>

<body>
    <section>
        <!-- Loan Detail Header -->
        <div
            style="background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--card-shadow); padding: 1.5rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div
                    style="background: #fdf2f2; color: var(--danger); width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                    <i data-lucide="banknote" style="width: 24px; height: 24px;"></i>
                </div>
                <div>
                    <h2 style="font-size: 1.125rem; font-weight: 700; margin: 0;" th:text="${loan.loanType}">Home Loan
                    </h2>
                    <p style="font-size: 0.8125rem; color: var(--secondary); margin: 0;">Disbursed to <span
                            th:text="${loan.user.name}">John</span> on <span th:text="${loan.startDate}">2024</span></p>
                </div>
            </div>
            <div style="text-align: right;">
                <p
                    style="font-size: 0.75rem; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.25rem;">
                    Remaining Balance</p>
                <p style="font-size: 1.5rem; font-weight: 800; color: var(--danger); margin: 0;"
                    th:text="${'₹' + #numbers.formatDecimal(summary.remainingBalance, 1, 'COMMA', 2, 'POINT')}">₹0.00
                </p>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 3fr; gap: 1.5rem;">
            <!-- Left: Sidebar Summary -->
            <div>
                <div class="card-table-wrapper" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                    <h3 style="font-size: 0.875rem; font-weight: 600; color: var(--secondary); margin-bottom: 1.25rem;">
                        INSIGHTS</h3>
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <div>
                            <p style="font-size: 0.625rem; color: var(--secondary); margin: 0;">TOTAL PRINCIPAL</p>
                            <p style="font-weight: 700;" th:text="${'₹' + loan.principal}">₹10,000</p>
                        </div>
                        <div>
                            <p style="font-size: 0.625rem; color: var(--secondary); margin: 0;">INTEREST RATE</p>
                            <p style="font-weight: 700;" th:text="${loan.interestRate + '% p.a.'}">12%</p>
                        </div>
                        <div>
                            <p style="font-size: 0.625rem; color: var(--secondary); margin: 0;">EMI AMOUNT</p>
                            <p style="font-weight: 700; color: var(--primary);" th:text="${'₹' + loan.emiAmount}">₹933
                            </p>
                        </div>
                    </div>
                </div>

                <div class="card-table-wrapper" style="padding: 1.5rem;">
                    <h3 style="font-size: 0.875rem; font-weight: 600; color: var(--secondary); margin-bottom: 1rem;">
                        QUICK PAY</h3>
                    <form th:action="@{/api/emipayments/view/{loanId}/add(loanId=${loan.loanId})}" method="post">
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <input name="amountPaid" type="number" step="0.01" class="form-control"
                                style="font-size: 0.8125rem;" placeholder="Amount">
                        </div>
                        <button type="submit" class="btn-primary"
                            style="width: 100%; justify-content: center; font-size: 0.8125rem;">
                            <i data-lucide="zap" style="width: 14px; height: 14px;"></i>
                            <span>Instant Payment</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right: Schedule Table -->
            <div class="card-table-wrapper">
                <div class="card-table-header">
                    <h2 class="table-title">Repayment Schedule</h2>
                </div>
                <div style="overflow-x: auto;">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Due Date</th>
                                <th style="text-align: right;">Installment</th>
                                <th>Payment Date</th>
                                <th>Status</th>
                                <th style="text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${payments}">
                                <td th:text="${p.dueDate}">2024-04-01</td>
                                <td style="text-align: right; font-weight: 600;"
                                    th:text="${'₹' + (p.status == 'PAID' ? p.amountPaid : (p.extraDue ?: loan.emiAmount))}">
                                    ₹933</td>
                                <td th:text="${p.paymentDate ?: '--'}">--</td>
                                <td>
                                    <span th:if="${p.status == 'PAID'}" class="badge badge-paid">PAID</span>
                                    <span th:if="${p.status != 'PAID'}" class="badge badge-pending">PENDING</span>
                                </td>
                                <td style="text-align: right;">
                                    <button th:if="${p.status == 'PENDING'}" class="btn-outline"
                                        th:data-id="${p.paymentId}" onclick="handlePayment(this)"
                                        style="padding: 0.25rem 0.5rem; font-size: 0.75rem; border-color: var(--success); color: var(--success);">
                                        Execute Payment
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script>
            async function handlePayment(btn) {
                const id = btn.getAttribute('data-id');
                if (!confirm("Confirm loan repayment execution?")) return;
                try {
                    btn.disabled = true;
                    btn.textContent = "Processing...";
                    await axios.post('/api/emipayments/pay/' + id);
                    window.location.reload();
                } catch (err) {
                    alert("Payment failed: " + (err.response?.data || "System Error"));
                    btn.disabled = false;
                    btn.textContent = "Execute Payment";
                }
            }
        </script>
    </section>
</body>

</html>
