<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: layout(~{::section}, 'Account Insight', 'dashboard')}">

<head>
</head>

<body>
    <section>
        <div class="stats-grid">
            <!-- Summary Stats -->
            <div class="stat-card">
                <div>
                    <p class="stat-label">Total Outstanding</p>
                    <p class="stat-value"
                        th:text="${'₹' + #numbers.formatDecimal(summary.remainingBalance, 1, 'COMMA', 2, 'POINT')}">
                        ₹0.00</p>
                </div>
                <div class="stat-trend trend-down">
                    <i data-lucide="alert-circle" style="width: 14px; height: 14px; vertical-align: middle;"></i>
                    <span>Remaining Principal + Interest</span>
                </div>
            </div>
            <div class="stat-card">
                <div>
                    <p class="stat-label">EMI Progress</p>
                    <p class="stat-value"><span th:text="${summary.paidEmis}">0</span> / <span
                            th:text="${summary.totalEmis}">0</span></p>
                </div>
                <div class="stat-trend trend-up">
                    <i data-lucide="check-square" style="width: 14px; height: 14px; vertical-align: middle;"></i>
                    <span>Installments Completed</span>
                </div>
            </div>
            <div class="stat-card">
                <div>
                    <p class="stat-label">Next Payment</p>
                    <p class="stat-value" th:text="${summary.nextDueDate ?: 'No Pending'}">2024-03-25</p>
                </div>
                <div class="stat-trend" style="color: var(--warning);">
                    <i data-lucide="calendar" style="width: 14px; height: 14px; vertical-align: middle;"></i>
                    <span>Upcoming Due Date</span>
                </div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-top: 2rem;">
            <!-- Active Loans -->
            <div class="card-table-wrapper">
                <div class="card-table-header">
                    <h2 class="table-title">Active Loan Portfolios</h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Principal</th>
                            <th>EMI</th>
                            <th>Remaining</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="loan : ${loans}">
                            <td>
                                <div style="display: flex; align-items: center; gap: 0.5rem;">
                                    <div
                                        style="width: 8px; height: 8px; border-radius: 50%; background: var(--primary);">
                                    </div>
                                    <span th:text="${loan.loanType}">Home</span>
                                </div>
                            </td>
                            <td class="fw-600" th:text="${'₹' + loan.principal}">₹50k</td>
                            <td th:text="${'₹' + loan.emiAmount}">₹2k</td>
                            <td style="color: var(--danger); font-weight: 600;"
                                th:text="${'₹' + loan.remainingBalance}">₹10k</td>
                            <td style="text-align: right;">
                                <a th:href="@{'/loan/' + ${loan.loanId} + '/emipayment'}" class="btn-outline">
                                    <i data-lucide="eye" style="width: 14px; height: 14px; vertical-align: middle;"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(loans)}">
                            <td colspan="5" style="text-align: center; color: var(--secondary); padding: 2rem;">No
                                active loans.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Visual Insight -->
            <div class="card-table-wrapper" style="padding: 1.5rem;">
                <h2 class="table-title" style="margin-bottom: 1.5rem;">Credit Health</h2>
                <div
                    style="height: 200px; display: flex; align-items: center; justify-content: center; position: relative;">
                    <canvas id="healthChart"></canvas>
                </div>
                <div style="margin-top: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="font-size: 0.75rem; color: var(--secondary);">Repayment Ratio</span>
                        <span style="font-size: 0.75rem; font-weight: 700; color: var(--success);"
                            th:text="${(summary.totalEmis > 0 ? (summary.paidEmis * 100 / summary.totalEmis) : 0) + '%'}">75%</span>
                    </div>
                    <div style="width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden;">
                        <div
                            th:style="'width:' + (summary.totalEmis > 0 ? (summary.paidEmis * 100 / summary.totalEmis) : 0) + '%; height: 100%; background: var(--success);'">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:inline="javascript">
            const paid = /*[[${summary.totalPaid}]]*/ 0;
            const remaining = /*[[${summary.remainingBalance}]]*/ 0;

            new Chart(document.getElementById('healthChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Paid', 'Remaining'],
                    datasets: [{
                        data: [paid, remaining],
                        backgroundColor: ['#10b981', '#f1f5f9'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    cutout: '80%',
                    plugins: { legend: { display: false } },
                    maintainAspectRatio: false
                }
            });
        </script>
    </section>
</body>

</html>
