<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section}, 'Create User', 'users')}">

<head>
</head>

<body>
    <section>
        <div class="form-card">
            <div style="margin-bottom: 2rem;">
                <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">User Information</h2>
                <p style="font-size: 0.875rem; color: var(--secondary);">Enter the details of the new user to manage
                    their loans and payments.</p>
            </div>

            <form th:action="@{/users}" th:object="${user}" method="post" onsubmit="return validateForm()">
                <input type="hidden" th:field="*{userId}">

                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input th:field="*{name}" id="name" type="text" class="form-control" placeholder="e.g. Sanjana B"
                        required>
                    <span id="nameError" class="error-msg"
                        style="display: none; color: var(--danger); font-size: 0.75rem; margin-top: 0.25rem;">Name is
                        required.</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input th:field="*{email}" id="email" type="email" class="form-control"
                        placeholder="sanjana@example.com" required>
                    <span id="emailError" class="error-msg"
                        style="display: none; color: var(--danger); font-size: 0.75rem; margin-top: 0.25rem;">Please
                        enter a valid email.</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contactNo">Contact Number</label>
                    <input th:field="*{contactNo}" id="contactNo" type="text" class="form-control"
                        placeholder="e.g. 9876543210" required pattern="[0-9]{10,}">
                    <span id="contactError" class="error-msg"
                        style="display: none; color: var(--danger); font-size: 0.75rem; margin-top: 0.25rem;">Enter a
                        valid 10+ digit number.</span>
                </div>

                <div
                    style="display: flex; gap: 1rem; margin-top: 2rem; border-top: 1px solid #f1f5f9; padding-top: 1.5rem;">
                    <button type="submit" class="btn-primary" style="flex: 2; justify-content: center;">
                        <i data-lucide="save" style="width: 18px; height: 18px;"></i>
                        <span th:text="${user.userId != null ? 'Update User' : 'Create User'}">Create User</span>
                    </button>
                    <a th:href="@{/}" class="btn-outline" style="flex: 1; text-align: center;">Cancel</a>
                </div>
            </form>

            <script>
                function validateForm() {
                    let isValid = true;
                    const name = document.getElementById('name');
                    const email = document.getElementById('email');
                    const contact = document.getElementById('contactNo');

                    // Reset errors
                    document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
                    document.querySelectorAll('.form-control').forEach(el => el.style.borderColor = '');

                    if (!name.value.trim()) {
                        document.getElementById('nameError').style.display = 'block';
                        name.style.borderColor = 'var(--danger)';
                        isValid = false;
                    }

                    if (!email.value.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
                        document.getElementById('emailError').style.display = 'block';
                        email.style.borderColor = 'var(--danger)';
                        isValid = false;
                    }

                    if (!contact.value.match(/^[0-9]{10,}$/)) {
                        document.getElementById('contactError').style.display = 'block';
                        contact.style.borderColor = 'var(--danger)';
                        isValid = false;
                    }

                    return isValid;
                }
            </script>
        </div>
    </section>
</body>

</html>
