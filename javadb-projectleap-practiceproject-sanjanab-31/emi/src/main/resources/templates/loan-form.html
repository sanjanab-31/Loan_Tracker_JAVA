<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section}, 'Disburse Loan', 'loans')}">

<head>
</head>

<body>
    <section>
        <div class="form-card">
            <div style="margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;">
                <div style="background: #eff6ff; padding: 0.75rem; border-radius: 12px;">
                    <i data-lucide="file-text" style="color: var(--primary); width: 24px; height: 24px;"></i>
                </div>
                <div>
                    <h2 style="font-size: 1.25rem; font-weight: 700; margin: 0;">Loan Disbursal</h2>
                    <p style="font-size: 0.875rem; color: var(--secondary); margin: 0;">Disbursing to: <strong
                            style="color: var(--dark);" th:text="${loan.user.name}">John Doe</strong></p>
                </div>
            </div>

            <form th:action="@{/loans}" method="post">
                <input type="hidden" name="user.userId" th:value="${loan.user.userId}" />

                <div class="form-group">
                    <label class="form-label">Loan Classification</label>
                    <select name="loanType" class="form-control" required>
                        <option value="Personal Loan">Personal Loan</option>
                        <option value="Home Loan">Home Loan</option>
                        <option value="Vehicle Loan">Vehicle Loan</option>
                        <option value="Education Loan">Education Loan</option>
                        <option value="Business Loan">Business Loan</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label">Principal Amount (₹)</label>
                        <input name="principal" type="number" step="100" class="form-control" placeholder="e.g. 50000"
                            required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Annual Interest (%)</label>
                        <input name="interestRate" type="number" step="0.1" class="form-control" placeholder="e.g. 10.5"
                            required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label">Tenure (Months)</label>
                        <input name="tenureMonths" type="number" class="form-control" placeholder="e.g. 12" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Disbursal Date</label>
                        <input name="startDate" type="date" class="form-control"
                            th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>
                </div>

                <div
                    style="background-color: #f0f9ff; border: 1px solid #bae6fd; padding: 1.5rem; border-radius: var(--radius-lg); margin-top: 1rem; margin-bottom: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <p style="font-size: 0.75rem; color: var(--secondary); margin-bottom: 0.25rem;">Estimated
                                Monthly EMI</p>
                            <h3 id="emiPreview"
                                style="font-size: 1.5rem; font-weight: 800; color: var(--primary); margin: 0;">₹0.00
                            </h3>
                        </div>
                        <div style="text-align: right;">
                            <p style="font-size: 0.75rem; color: var(--secondary); margin-bottom: 0.25rem;">Total
                                Payable</p>
                            <p id="totalPreview"
                                style="font-size: 1rem; font-weight: 700; color: var(--dark); margin: 0;">₹0.00</p>
                        </div>
                    </div>
                </div>

                <script>
                    const principalInput = document.getElementsByName('principal')[0];
                    const rateInput = document.getElementsByName('interestRate')[0];
                    const tenureInput = document.getElementsByName('tenureMonths')[0];
                    const emiPreview = document.getElementById('emiPreview');
                    const totalPreview = document.getElementById('totalPreview');

                    function calculateEMI() {
                        const P = parseFloat(principalInput.value) || 0;
                        const R = parseFloat(rateInput.value) || 0;
                        const N = parseInt(tenureInput.value) || 0;

                        if (P > 0 && R > 0 && N > 0) {
                            const r = (R / 12) / 100;
                            const emi = P * r * Math.pow(1 + r, N) / (Math.pow(1 + r, N) - 1);
                            const total = emi * N;

                            emiPreview.innerText = '₹' + emi.toLocaleString('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
                            totalPreview.innerText = '₹' + total.toLocaleString('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
                        } else {
                            emiPreview.innerText = '₹0.00';
                            totalPreview.innerText = '₹0.00';
                        }
                    }

                    principalInput.addEventListener('input', calculateEMI);
                    rateInput.addEventListener('input', calculateEMI);
                    tenureInput.addEventListener('input', calculateEMI);
                </script>

                <div style="display: flex; gap: 1rem; border-top: 1px solid #f1f5f9; padding-top: 1.5rem;">
                    <button type="submit" class="btn-primary" style="flex: 2; justify-content: center;">
                        <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
                        <span>Confirm Disbursal</span>
                    </button>
                    <a th:href="@{/loans(userId=${loan.user.userId})}" class="btn-outline"
                        style="flex: 1; text-align: center; border: 1px solid #e2e8f0;">Cancel</a>
                </div>
            </form>
        </div>
    </section>
</body>

</html>
